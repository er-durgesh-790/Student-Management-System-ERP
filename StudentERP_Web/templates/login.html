<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student ERP - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #2563eb, #1e3a8a);
        }

        .login-container {
            width: 420px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #2563eb;
            color: white;

            border-radius: 18px;
            font-size: 35px;
        }

        h1 {
            text-align: center;
            color: #111827;
            font-size: 27px;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #374151;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;
            margin-top: 8px;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .forgot {
            text-align: right;
            margin-top: 12px;
        }

        .forgot a {
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #9ca3af;
            font-size: 12px;
        }

        .message {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            🎓
        </div>

        <h1>Student ERP</h1>

        <p class="subtitle">
            Student Management System
        </p>

        {% if error %}
        <div class="message">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">

            <div class="form-group">

                <label>Login As</label>

                <select name="user_type" required>

                    <option value="admin">
                        Admin
                    </option>

                    <option value="student">
                        Student
                    </option>

                </select>

            </div>

            <div class="form-group">

                <label>Username / Student ID</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username or Student ID"
                    required
                >

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>

        </form>

        <div class="forgot">
            <a href="#">Forgot Password?</a>
        </div>

        <div class="footer">
            © 2026 Student Management System ERP
        </div>

    </div>

</body>

</html>
