<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Results</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f5f7fb;color:#0f172a}.top{height:70px;background:linear-gradient(100deg,#1d4ed8,#4f46e5);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.top a{color:#fff;text-decoration:none;background:#ffffff20;border:1px solid #ffffff2d;padding:9px 12px;border-radius:10px;font-size:12px;font-weight:800}.wrap{max-width:1100px;margin:auto;padding:20px 14px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:18px;padding:20px;box-shadow:0 8px 24px #0f172a08;margin-bottom:15px}.title{font-size:25px;margin:0 0 6px}.muted{color:#64748b;font-size:13px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:12px;border-bottom:1px solid #eef2f7;text-align:left;font-size:13px}.table th{background:#f8fafc;color:#475569}.back{display:inline-block;margin-bottom:15px}@media(max-width:600px){.top{height:auto;min-height:64px}.wrap{padding:14px 10px}.title{font-size:22px}.card{padding:16px}.table th,.table td{padding:9px;font-size:12px}}</style></head><body><header class="top"><strong>🎓 Student ERP</strong><a href="/student-dashboard">← Dashboard</a></header><main class="wrap"><div class="card"><h1 class="title">My Results</h1><p class="muted">Your latest examination results</p></div><div class="card table-wrap"><table class="table"><tr><th>Subject</th><th>Marks</th><th>Grade</th><th>Percentage</th><th>Status</th></tr>{% for r in results %}<tr><td>{{ r[4] }}</td><td>{{ r[5] }}</td><td>{{ r[6] }}</td><td>{{ r[7] }}%</td><td>{{ r[8] }}</td></tr>{% else %}<tr><td colspan="5">No result records available.</td></tr>{% endfor %}</table></div></main></body></html>
