```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Portal | Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;

            background:
                radial-gradient(
                    circle at top left,
                    #60a5fa 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #a78bfa 0%,
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #1d4ed8,
                    #6d28d9
                );
        }

        /* =========================
           MAIN CARD
        ========================= */

        .login-container {

            width: 100%;
            max-width: 440px;

            background: rgba(255,255,255,0.97);

            padding: 40px 38px;

            border-radius: 22px;

            box-shadow:
                0 25px 60px rgba(0,0,0,0.25);

            animation: slideUp 0.5s ease;

        }

        @keyframes slideUp {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* =========================
           LOGO
        ========================= */

        .logo {

            width: 82px;
            height: 82px;

            margin: 0 auto 18px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            color: white;

            font-size: 40px;

            box-shadow:
                0 12px 25px
                rgba(37,99,235,0.30);

        }

        /* =========================
           TITLE
        ========================= */

        h1 {

            text-align: center;

            color: #172033;

            font-size: 27px;

            font-weight: 700;

            margin-bottom: 7px;

        }

        .subtitle {

            text-align: center;

            color: #64748b;

            font-size: 14px;

            margin-bottom: 30px;

        }

        /* =========================
           ERROR
        ========================= */

        .error {

            display: flex;

            align-items: center;

            gap: 9px;

            background: #fff1f2;

            border: 1px solid #fecdd3;

            color: #be123c;

            padding: 12px 14px;

            border-radius: 10px;

            margin-bottom: 20px;

            font-size: 14px;

            line-height: 1.4;

        }

        .error-icon {
            font-size: 18px;
        }

        /* =========================
           FORM
        ========================= */

        .form-group {

            margin-bottom: 20px;

        }

        label {

            display: block;

            margin-bottom: 8px;

            color: #334155;

            font-size: 14px;

            font-weight: 600;

        }

        .input-wrapper {

            position: relative;

        }

        input {

            width: 100%;

            height: 48px;

            padding: 0 14px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            background: #f8fafc;

            color: #1e293b;

            font-size: 15px;

            outline: none;

            transition: 0.2s;

        }

        input:focus {

            background: white;

            border-color: #2563eb;

            box-shadow:
                0 0 0 4px
                rgba(37,99,235,0.10);

        }

        input::placeholder {
            color: #94a3b8;
        }

        /* =========================
           PASSWORD
        ========================= */

        .password-input {

            padding-right: 48px;

        }

        .show-password {

            position: absolute;

            right: 13px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 18px;

            color: #64748b;

        }

        .show-password:hover {

            color: #2563eb;

        }

        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-btn {

            width: 100%;

            height: 50px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 5px;

            transition: 0.2s;

            box-shadow:
                0 8px 18px
                rgba(37,99,235,0.25);

        }

        .login-btn:hover {

            transform: translateY(-1px);

            box-shadow:
                0 12px 24px
                rgba(37,99,235,0.32);

        }

        .login-btn:active {

            transform: translateY(0);

        }

        /* =========================
           LOADING
        ========================= */

        .login-btn.loading {

            opacity: 0.75;

            cursor: wait;

        }

        /* =========================
           FOOTER
        ========================= */

        .portal-info {

            text-align: center;

            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #e2e8f0;

            color: #64748b;

            font-size: 12px;

        }

        .back {

            text-align: center;

            margin-top: 18px;

        }

        .back a {

            color: #2563eb;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

        }

        .back a:hover {

            text-decoration: underline;

        }

        /* =========================
           SECURITY TEXT
        ========================= */

        .security {

            text-align: center;

            margin-top: 14px;

            color: #94a3b8;

            font-size: 11px;

        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 500px) {

            body {

                padding: 15px;

            }

            .login-container {

                padding: 30px 24px;

                border-radius: 18px;

            }

            .logo {

                width: 72px;

                height: 72px;

                font-size: 34px;

            }

            h1 {

                font-size: 23px;

            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <!-- LOGO -->

    <div class="logo">
        🎓
    </div>


    <!-- TITLE -->

    <h1>
        Student Portal
    </h1>


    <p class="subtitle">
        Student Management System ERP
    </p>


    <!-- ERROR MESSAGE -->

    {% if error %}

    <div class="error">

        <span class="error-icon">
            ⚠️
        </span>

        <span>
            {{ error }}
        </span>

    </div>

    {% endif %}


    <!-- LOGIN FORM -->

    <form
        action="/student-login"
        method="POST"
        id="studentLoginForm"
    >


        <!-- STUDENT ID -->

        <div class="form-group">

            <label for="student_id">
                Student ID
            </label>

            <div class="input-wrapper">

                <input
                    type="text"
                    id="student_id"
                    name="student_id"
                    placeholder="Enter your Student ID"
                    autocomplete="username"
                    maxlength="50"
                    required
                    autofocus
                >

            </div>

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="input-wrapper">

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="password-input"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    maxlength="100"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    id="togglePassword"
                    aria-label="Show password"
                >
                    👁️
                </button>

            </div>

        </div>


        <!-- LOGIN -->

        <button
            type="submit"
            class="login-btn"
            id="loginButton"
        >

            <span id="buttonText">
                Login to Student Portal
            </span>

        </button>


    </form>


    <!-- BACK -->

    <div class="back">

        <a href="/">
            ← Back to Main Login
        </a>

    </div>


    <!-- INFO -->

    <div class="portal-info">

        Secure Student Access • Student ERP Portal

    </div>


    <div class="security">

        🔒 Your login information is protected

    </div>


</div>


<script>

    // =========================================
    // SHOW / HIDE PASSWORD
    // =========================================

    const passwordInput =
        document.getElementById("password");

    const togglePassword =
        document.getElementById("togglePassword");


    togglePassword.addEventListener(
        "click",
        function () {

            if (
                passwordInput.type === "password"
            ) {

                passwordInput.type = "text";

                togglePassword.textContent = "🙈";

                togglePassword.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            } else {

                passwordInput.type = "password";

                togglePassword.textContent = "👁️";

                togglePassword.setAttribute(
                    "aria-label",
                    "Show password"
                );

            }

        }
    );


    // =========================================
    // LOGIN BUTTON LOADING
    // =========================================

    const loginForm =
        document.getElementById(
            "studentLoginForm"
        );

    const loginButton =
        document.getElementById(
            "loginButton"
        );

    const buttonText =
        document.getElementById(
            "buttonText"
        );


    loginForm.addEventListener(
        "submit",
        function () {

            loginButton.classList.add(
                "loading"
            ); 

            loginButton.disabled = true;

            buttonText.textContent =
                "Signing in...";

        }
    );

</script>


</body>

</html>
```
