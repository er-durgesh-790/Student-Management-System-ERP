```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Result - Student ERP</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f1f5f9;
            color: #1e293b;
        }


        /* =========================
           HEADER
        ========================= */

        .header {

            background: #2563eb;

            color: white;

            min-height: 70px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 30px;
        }


        .header h1 {
            font-size: 23px;
        }


        .back-btn {

            background: #475569;

            color: white;

            text-decoration: none;

            padding: 10px 18px;

            border-radius: 7px;

            font-weight: bold;
        }


        .back-btn:hover {
            background: #334155;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            max-width: 900px;

            margin: 35px auto;

            padding: 0 20px;
        }


        .card {

            background: white;

            padding: 30px;

            border-radius: 14px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.08);
        }


        .title {

            font-size: 26px;

            margin-bottom: 25px;

            color: #1e293b;
        }


        /* =========================
           FORM
        ========================= */

        .form-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }


        .form-group {

            display: flex;

            flex-direction: column;
        }


        .form-group.full {

            grid-column: 1 / -1;
        }


        label {

            font-weight: bold;

            margin-bottom: 7px;

            color: #334155;
        }


        input,
        select {

            width: 100%;

            padding: 11px 13px;

            border: 1px solid #cbd5e1;

            border-radius: 7px;

            font-size: 15px;

            outline: none;
        }


        input:focus,
        select:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 2px
                rgba(37,99,235,0.12);
        }


        /* =========================
           BUTTONS
        ========================= */

        .buttons {

            margin-top: 30px;

            display: flex;

            gap: 12px;
        }


        .update-btn {

            background: #16a34a;

            color: white;

            border: none;

            padding: 12px 24px;

            border-radius: 7px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }


        .update-btn:hover {

            background: #15803d;
        }


        .cancel-btn {

            background: #64748b;

            color: white;

            text-decoration: none;

            padding: 12px 24px;

            border-radius: 7px;

            font-weight: bold;
        }


        .cancel-btn:hover {

            background: #475569;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 700px) {

            .header {

                padding: 15px;

                flex-direction: column;

                gap: 12px;

                text-align: center;
            }


            .container {

                margin: 20px auto;

                padding: 0 12px;
            }


            .card {

                padding: 20px;
            }


            .form-grid {

                grid-template-columns: 1fr;
            }


            .form-group.full {

                grid-column: auto;
            }


            .buttons {

                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<!-- =================================================
     HEADER
================================================== -->

<div class="header">

    <h1>
        📊 Student Management System ERP
    </h1>


    <a
        href="/results"
        class="back-btn"
    >
        ← Back to Results
    </a>

</div>



<!-- =================================================
     MAIN CONTAINER
================================================== -->

<div class="container">


    <div class="card">


        <h2 class="title">
            ✏️ Edit Student Result
        </h2>



        <!-- =================================================
             UPDATE FORM
        ================================================== -->

        <form
            action="/results/update/{{ result[0] }}"
            method="POST"
        >


            <div class="form-grid">


                <!-- STUDENT ID -->

                <div class="form-group">

                    <label>
                        Student ID
                    </label>

                    <input
                        type="text"
                        name="student_id"
                        value="{{ result[1] or '' }}"
                        required
                    >

                </div>



                <!-- STUDENT NAME -->

                <div class="form-group">

                    <label>
                        Student Name
                    </label>

                    <input
                        type="text"
                        name="student_name"
                        value="{{ result[2] or '' }}"
                        required
                    >

                </div>



                <!-- COURSE -->

                <div class="form-group">

                    <label>
                        Course
                    </label>

                    <input
                        type="text"
                        name="course"
                        value="{{ result[3] or '' }}"
                    >

                </div>



                <!-- SUBJECT -->

                <div class="form-group">

                    <label>
                        Subject
                    </label>

                    <input
                        type="text"
                        name="subject"
                        value="{{ result[4] or '' }}"
                    >

                </div>



                <!-- MARKS -->

                <div class="form-group">

                    <label>
                        Marks
                    </label>

                    <input
                        type="number"
                        name="marks"
                        value="{{ result[5] or '' }}"
                    >

                </div>



                <!-- GRADE -->

                <div class="form-group">

                    <label>
                        Grade
                    </label>

                    <input
                        type="text"
                        name="grade"
                        value="{{ result[6] or '' }}"
                    >

                </div>



                <!-- PERCENTAGE -->

                <div class="form-group">

                    <label>
                        Percentage
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        name="percentage"
                        value="{{ result[7] or '' }}"
                    >

                </div>



                <!-- STATUS -->

                <div class="form-group">

                    <label>
                        Status
                    </label>

                    <select name="status">


                        <option
                            value="Pass"
                            {% if result[8] == "Pass" %}
                            selected
                            {% endif %}
                        >
                            Pass
                        </option>


                        <option
                            value="Fail"
                            {% if result[8] == "Fail" %}
                            selected
                            {% endif %}
                        >
                            Fail
                        </option>


                        <option
                            value="Pending"
                            {% if result[8] == "Pending" %}
                            selected
                            {% endif %}
                        >
                            Pending
                        </option>


                    </select>

                </div>


            </div>



            <!-- =================================================
                 BUTTONS
            ================================================== -->

            <div class="buttons">


                <button
                    type="submit"
                    class="update-btn"
                >
                    💾 Update Result
                </button>


                <a
                    href="/results"
                    class="cancel-btn"
                >
                    Cancel
                </a>


            </div>


        </form>


    </div>

</div>


</body>

</html>
```
