<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student ERP | Change Password</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#eff6ff,#f5f3ff);min-height:100vh;color:#0f172a}.top{height:70px;background:linear-gradient(100deg,#1d4ed8,#4f46e5);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.top a{color:#fff;text-decoration:none;background:#ffffff20;padding:9px 12px;border-radius:10px;font-size:13px;font-weight:700}.page{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:18px}.card{width:min(440px,100%);background:#fff;border-radius:23px;padding:30px;box-shadow:0 24px 60px #312e811c;border:1px solid #e5e7eb}.icon{font-size:30px;width:60px;height:60px;background:#eef2ff;border-radius:17px;display:grid;place-items:center}.card h1{margin:15px 0 5px}.sub{font-size:13px;color:#64748b;margin-bottom:20px}.message{padding:11px;border-radius:10px;font-size:13px;margin-bottom:14px}.error{background:#fff1f2;color:#be123c}.success{background:#f0fdf4;color:#15803d}.group{margin-bottom:14px}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}input{width:100%;height:47px;border:1px solid #dbe3ef;border-radius:11px;padding:0 13px;font-size:15px;outline:none;background:#f8fafc}.pass{position:relative}.pass input{padding-right:48px}.toggle{position:absolute;right:7px;top:7px;border:0;background:transparent;width:35px;height:33px;cursor:pointer}.btn{width:100%;height:48px;border:0;border-radius:11px;background:#4f46e5;color:#fff;font-weight:800;cursor:pointer}.note{text-align:center;color:#94a3b8;font-size:12px;margin-top:15px}</style></head><body><header class="top"><strong>🎓 Student ERP</strong><a href="/student-dashboard">← Dashboard</a></header><main class="page"><section class="card"><div class="icon">🔐</div><h1>Change Password</h1><div class="sub">Keep your student account secure.</div>{% if error %}<div class="message error">{{ error }}</div>{% endif %}{% if success %}<div class="message success">{{ success }}</div>{% endif %}<form method="POST" action="/student-change-password"><div class="group"><label>Current Password</label><div class="pass"><input id="old" type="password" name="old_password" required><button class="toggle" type="button" onclick="toggle('old')">👁</button></div></div><div class="group"><label>New Password</label><div class="pass"><input id="new" type="password" name="new_password" minlength="4" required><button class="toggle" type="button" onclick="toggle('new')">👁</button></div></div><div class="group"><label>Confirm New Password</label><div class="pass"><input id="confirm" type="password" name="confirm_password" minlength="4" required><button class="toggle" type="button" onclick="toggle('confirm')">👁</button></div></div><button class="btn" type="submit">Update Password</button></form><div class="note">Student ERP • Developed by Durgesh Gupta</div></section></main><script>function toggle(id){const x=document.getElementById(id);x.type=x.type==='password'?'text':'password'}</script></body></html>
