<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student ERP | Change Password</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#eff6ff,#eef2ff);min-height:100vh;color:#0f172a}.top{height:70px;background:linear-gradient(100deg,#1747b8,#2563eb,#4f46e5);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 25px}.top a{color:#fff;text-decoration:none;background:#ffffff1c;border:1px solid #ffffff30;padding:9px 13px;border-radius:10px;font-weight:700;font-size:13px}.page{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:25px}.card{width:min(460px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:32px;box-shadow:0 25px 70px #1e3a8a18}.icon{width:64px;height:64px;border-radius:18px;background:#eef4ff;display:grid;place-items:center;font-size:30px;margin-bottom:17px}.eyebrow{font-size:12px;color:#2563eb;font-weight:800;text-transform:uppercase;letter-spacing:.12em}.card h1{margin:6px 0 6px;font-size:28px}.sub{color:#64748b;font-size:13px;margin-bottom:22px}.message{padding:12px;border-radius:11px;margin-bottom:15px;font-size:13px}.error{background:#fff1f2;border:1px solid #fecdd3;color:#be123c}.success{background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d}.group{margin-bottom:15px}label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}input{width:100%;height:47px;border:1px solid #dbe3ef;border-radius:11px;padding:0 13px;font-size:15px;outline:none;background:#f8fafc}input:focus{background:#fff;border-color:#2563eb;box-shadow:0 0 0 4px #2563eb15}.pass{position:relative}.pass input{padding-right:48px}.toggle{position:absolute;right:7px;top:7px;width:35px;height:33px;border:0;background:transparent;cursor:pointer}.btn{width:100%;height:49px;border:0;border-radius:11px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;font-weight:800;cursor:pointer;margin-top:4px}.note{margin-top:17px;text-align:center;font-size:12px;color:#94a3b8}@media(max-width:500px){.top{padding:0 14px}.top strong{font-size:14px}.page{padding:15px}.card{padding:25px 20px;border-radius:20px}}</style></head><body><header class="top"><strong>🎓 Student ERP</strong><a href="/dashboard">← Dashboard</a></header><main class="page"><section class="card"><div class="icon">🔐</div><div class="eyebrow">Account Security</div><h1>Change Password</h1><div class="sub">{{ admin_name }} • @{{ admin_username }}</div>{% if error %}<div class="message error">{{ error }}</div>{% endif %}{% if success %}<div class="message success">{{ success }}</div>{% endif %}<form method="POST" action="/change-password"><div class="group"><label>Current Password</label><div class="pass"><input id="old" type="password" name="old_password" required><button class="toggle" type="button" onclick="toggle('old')">👁</button></div></div><div class="group"><label>New Password</label><div class="pass"><input id="new" type="password" name="new_password" minlength="6" required><button class="toggle" type="button" onclick="toggle('new')">👁</button></div></div><div class="group"><label>Confirm New Password</label><div class="pass"><input id="confirm" type="password" name="confirm_password" minlength="6" required><button class="toggle" type="button" onclick="toggle('confirm')">👁</button></div></div><button class="btn" type="submit">Update Password</button></form><div class="note">Use at least 6 characters and keep your password private.</div></section></main><script>function toggle(id){const x=document.getElementById(id);x.type=x.type==='password'?'text':'password'}</script></body></html>
